name: build-and-test

on:
  push:
    branches:
      - main
      - 'eoingtilab/**'
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality-gate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore application and tests
        run: |
          dotnet restore src/NalApps.Macro/NalApps.Macro.csproj
          dotnet restore tests/NalApps.Macro.Tests/NalApps.Macro.Tests.csproj
          dotnet restore tests/NalApps.Macro.UiSmoke/NalApps.Macro.UiSmoke.csproj

      - name: Build application with warnings as errors
        run: dotnet build src/NalApps.Macro/NalApps.Macro.csproj -c Release --no-restore -warnaserror

      - name: Build automated test harnesses with warnings as errors
        run: |
          dotnet build tests/NalApps.Macro.Tests/NalApps.Macro.Tests.csproj -c Release --no-restore -warnaserror
          dotnet build tests/NalApps.Macro.UiSmoke/NalApps.Macro.UiSmoke.csproj -c Release --no-restore -warnaserror

      - name: Run ISO-aligned automated regression tests
        run: dotnet run --project tests/NalApps.Macro.Tests/NalApps.Macro.Tests.csproj -c Release --no-build

      - name: Run WPF mouse-apply lifecycle smoke test
        run: dotnet run --project tests/NalApps.Macro.UiSmoke/NalApps.Macro.UiSmoke.csproj -c Release --no-build

      - name: Publish portable single-file app
        run: dotnet publish src/NalApps.Macro/NalApps.Macro.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:DebugType=embedded -o artifacts/NalaApps-Macro-v1.1.1-win-x64

      - name: Verify published executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'artifacts/NalaApps-Macro-v1.1.1-win-x64/NalaApps.Macro.exe')) {
            throw 'NalaApps.Macro.exe was not created.'
          }

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/NalaApps-Macro-v1.1.1-win-x64/* -DestinationPath artifacts/NalaApps-Macro-v1.1.1-Portable-win-x64.zip -Force
          $hash = (Get-FileHash artifacts/NalaApps-Macro-v1.1.1-Portable-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NalaApps-Macro-v1.1.1-Portable-win-x64.zip" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NalaApps-Macro-v1.1.1
          path: |
            artifacts/NalaApps-Macro-v1.1.1-Portable-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
