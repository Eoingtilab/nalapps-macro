name: Windows build

on:
  push:
    branches:
      - main
      - 'eoingtilab/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore .\src\NalApps.Macro\NalApps.Macro.csproj
      - name: Build
        run: dotnet build .\src\NalApps.Macro\NalApps.Macro.csproj -c Release --no-restore
      - name: Publish single-file smoke test
        run: dotnet publish .\src\NalApps.Macro\NalApps.Macro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\publish-ci
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path '.\publish-ci\NalaApps.Macro.exe')) {
            throw 'NalaApps.Macro.exe was not created.'
          }
