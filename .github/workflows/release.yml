name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix'
        required: true
        default: '1.1.0'

permissions:
  contents: read

jobs:
  publish-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_REPOSITORY: Eoingtilab/nalapps-releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid semantic version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore application and tests
        shell: pwsh
        run: |
          dotnet restore src/NalApps.Macro/NalApps.Macro.csproj
          dotnet restore tests/NalApps.Macro.Tests/NalApps.Macro.Tests.csproj

      - name: Build application and tests
        shell: pwsh
        run: |
          dotnet build src/NalApps.Macro/NalApps.Macro.csproj -c Release --no-restore -warnaserror
          dotnet build tests/NalApps.Macro.Tests/NalApps.Macro.Tests.csproj -c Release --no-restore -warnaserror

      - name: Run automated quality gate
        run: dotnet run --project tests/NalApps.Macro.Tests/NalApps.Macro.Tests.csproj -c Release --no-build

      - name: Publish portable package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $publishDir = "artifacts/NalaApps-Macro-v$version-win-x64"
          $zipPath = "artifacts/NalaApps-Macro-v$version-Portable-win-x64.zip"
          dotnet publish src/NalApps.Macro/NalApps.Macro.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:Version=$version -p:FileVersion="$version.0" -p:AssemblyVersion="$version.0" -o $publishDir
          if (-not (Test-Path "$publishDir/NalaApps.Macro.exe")) {
            throw 'NalaApps.Macro.exe was not created.'
          }
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zipPath -Leaf)" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NalaApps-Macro-v${{ steps.version.outputs.version }}
          path: |
            artifacts/NalaApps-Macro-v${{ steps.version.outputs.version }}-Portable-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish to nalapps-releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.NALAPPS_RELEASES_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'NALAPPS_RELEASES_TOKEN secret is required to publish to Eoingtilab/nalapps-releases.'
          }
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $zip = "artifacts/NalaApps-Macro-v$version-Portable-win-x64.zip"
          gh release view $tag --repo $env:RELEASE_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists in $env:RELEASE_REPOSITORY. Existing releases are immutable."
          }
          gh release create $tag $zip artifacts/SHA256SUMS.txt --repo $env:RELEASE_REPOSITORY --title "NalaApps Macro v$version" --notes-file RELEASE_NOTES.md
